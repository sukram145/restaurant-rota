<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Restaurant Weekly Rota - Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --royal:#2563eb;
  --mid:#f59e0b;
  --closing:#7c3aed;
  --off:#dc2626;
  --border:#e5e7eb;
  --muted:#6b7280;
  --bg:#f8fafc;
  --header-bg:#111827;
  --card-bg:#ffffff;
}

*{box-sizing:border-box}
body{
  font-family:'Poppins', Arial, sans-serif;
  margin:0;
  background:var(--bg);
  color:#111827;
  padding:20px;
}

/* LOGIN SCREEN */
#loginScreen{
  max-width:420px;
  margin:70px auto;
  background:var(--card-bg);
  padding:30px;
  border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,0.08);
}
#loginScreen h2{margin-bottom:14px;text-align:center}
#loginScreen input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:15px;
}
#loginScreen button{
  width:100%;
  padding:12px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:var(--royal);
  color:#fff;
  cursor:pointer;
}
#errorMsg{color:#b91c1c;text-align:center;display:none;margin-top:10px}

/* APP */
#app{display:none}
.container{max-width:1200px;margin:auto}
.card{
  background:var(--card-bg);
  padding:20px;
  border-radius:12px;
  box-shadow:0 6px 24px rgba(0,0,0,0.06);
  margin-bottom:24px;
}
button{
  padding:10px 14px;
  font-size:15px;
  border:none;
  border-radius:8px;
  background:var(--royal);
  color:#fff;
  cursor:pointer;
}
button.small{font-size:14px;padding:8px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
select,input{font-size:15px;border:1px solid var(--border);border-radius:6px;padding:10px;width:100%}
.note{font-size:13px;color:var(--muted);margin-top:6px}

/* Table Styling */
#rotaContent{
  padding:24px 20px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 6px 24px rgba(0,0,0,0.05);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  margin-top:8px;
  border-radius:10px;
  overflow:hidden;
}
th{
  background:var(--header-bg);
  color:white;
  font-weight:600;
  padding:10px;
}
td{
  border:1px solid #e5e7eb;
  padding:8px;
  text-align:center;
}
tr:last-child td:first-child{border-bottom-left-radius:10px}
tr:last-child td:last-child{border-bottom-right-radius:10px}

select.shift{
  width:100%;
  padding:8px;
  font-size:13px;
  border:none;
  border-radius:6px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:0.4px;
}
.shift.morning{background:var(--royal)}
.shift.mid{background:var(--mid)}
.shift.closing{background:var(--closing)}
.shift.off{background:var(--off)}

.sectionTitle{
  font-weight:700;
  font-size:17px;
  margin:24px 0 8px 0;
  color:#111827;
  border-bottom:2px solid var(--border);
  padding-bottom:4px;
}

/* Export/Footer Area (hidden in export) */
#exportButtons{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#footerMsg{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}

/* Make exported image fill with white clean background */
@media print{
  #exportButtons,#footerMsg{display:none!important}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h2>🔒 Staff Rota Access</h2>
  <input id="username" placeholder="Username" autocomplete="username"/>
  <input type="password" id="password" placeholder="Password" autocomplete="current-password"/>
  <button onclick="login()">Login</button>
  <div id="errorMsg">Incorrect username or password</div>
</div>

<!-- APP -->
<div id="app" aria-hidden="true">
  <div class="container">
    <!-- Setup Card -->
    <div class="card">
      <h1>🧾 Staff Setup</h1>
      <div class="row">
        <input id="name" placeholder="Staff Name"/>
        <select id="restaurant">
          <option>Royal Java</option>
          <option>Taboche</option>
        </select>
      </div>
      <div class="row">
        <select id="offDay">
          <option>Sun</option><option>Mon</option><option>Tue</option>
          <option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option>
        </select>
        <select id="defaultShiftType">
          <option>Morning</option><option>Mid</option><option>Closing</option>
        </select>
      </div>
      <div class="row">
        <button onclick="addStaff()">Add Staff</button>
        <button class="small" onclick="resetRota()">Reset All</button>
      </div>
      <div class="row" style="margin-top:10px">
        <input type="date" id="weekStart"/>
        <button class="small" onclick="updateWeek()">Set Week</button>
      </div>
      <div id="saveLoad" style="margin-top:8px">
        <button class="small" onclick="saveToLocal()">Save</button>
        <button class="small" onclick="loadFromLocal()">Load</button>
        <button class="small" onclick="clearSaved()">Clear</button>
      </div>
      <div class="note">Mid shift = <strong>9AM–7PM</strong></div>
    </div>

    <!-- ROTA -->
    <div class="card" id="rotaArea">
      <div id="rotaContent">
        <h2 style="text-align:center;font-size:20px;margin-bottom:12px" id="weekTitle">
          Weekly Rota
        </h2>

        <div class="sectionTitle">Royal Java</div>
        <div class="table-wrapper">
          <table>
            <thead><tr id="royalHeader"></tr></thead>
            <tbody id="royalJava"></tbody>
          </table>
        </div>

        <div class="sectionTitle">Taboche</div>
        <div class="table-wrapper">
          <table>
            <thead><tr id="tabocheHeader"></tr></thead>
            <tbody id="taboche"></tbody>
          </table>
        </div>
      </div>

      <div id="exportButtons">
        <button onclick="exportImage()">⬇️ Export as Image</button>
        <button class="small" onclick="downloadCSV()">Download CSV</button>
        <button class="small" onclick="shareViaWhatsApp()">📱 Share to WhatsApp</button>
      </div>
      <div id="footerMsg">Tip: Click any dropdown to update shifts.</div>
    </div>
  </div>
</div>

<script>
let staff = [];
const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const shiftsRoyal=[
  {value:"OFF",label:"OFF"},
  {value:"7AM–5PM",label:"7AM–5PM"},
  {value:"9AM–7PM",label:"9AM–7PM"},
  {value:"11AM–9PM",label:"11AM–9PM"}];
const shiftsTaboche=[
  {value:"OFF",label:"OFF"},
  {value:"7AM–5PM",label:"7AM–5PM"},
  {value:"9AM–7PM",label:"9AM–7PM"},
  {value:"10AM–8PM",label:"10AM–8PM"}];
let currentWeekDates=[];

/* LOGIN */
function login(){
  const u=document.getElementById("username").value.trim();
  const p=document.getElementById("password").value;
  if(u==="royaljava"&&p==="Incorrect90!"){
    document.getElementById("loginScreen").style.display="none";
    const app=document.getElementById("app");app.style.display="block";
    initializeWeekToCurrentSunday();
    loadFromLocal();
  }else{
    const e=document.getElementById("errorMsg");
    e.style.display="block";setTimeout(()=>e.style.display="none",3000);
  }
}
function initializeWeekToCurrentSunday(){
  const today=new Date();const sun=new Date(today.getFullYear(),today.getMonth(),today.getDate()-today.getDay());
  document.getElementById("weekStart").valueAsDate=sun;updateWeek();
}
function mapDefaultShift(t,r){
  const o=r==="Royal Java"?shiftsRoyal:shiftsTaboche;
  if(t==="Morning")return o[1].value;
  if(t==="Mid")return o[2].value;
  return o[3].value;
}
function addStaff(){
  const n=document.getElementById("name").value.trim();
  if(!n)return alert("Enter name");
  const r=document.getElementById("restaurant").value;
  const off=document.getElementById("offDay").value;
  const dType=document.getElementById("defaultShiftType").value;
  const shift=mapDefaultShift(dType,r);
  staff.push({name:n,restaurant:r,offDay:off,defaultShiftType:dType,defaultShift:shift,schedule:{}});
  document.getElementById("name").value="";
  renderRota();
}
function updateWeek(){
  let start=document.getElementById("weekStart").value;if(!start)return;
  let sd=new Date(start);sd=new Date(sd.getFullYear(),sd.getMonth(),sd.getDate()-sd.getDay());
  currentWeekDates=[];for(let i=0;i<7;i++){currentWeekDates.push(new Date(sd.getFullYear(),sd.getMonth(),sd.getDate()+i));}
  const end=currentWeekDates[6];
  document.getElementById("weekTitle").innerText=`Weekly Rota (${sd.toDateString()} - ${end.toDateString()})`;
  renderHeaders();renderRota();
}
function renderHeaders(){
  const h="<th>Staff</th>"+currentWeekDates.map(d=>`<th>${days[d.getDay()]}<br>${d.getDate()}</th>`).join("");
  document.getElementById("royalHeader").innerHTML=h;
  document.getElementById("tabocheHeader").innerHTML=h;
}
function getShiftClass(s){
  if(s==="OFF")return"off";
  if(s==="7AM–5PM")return"morning";
  if(s==="9AM–7PM")return"mid";
  if(s==="11AM–9PM"||s==="10AM–8PM")return"closing";
  return"mid";
}
function dateKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function escapeHtml(s){return String(s).replace(/[&<>"'`=\/]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'}[c]));}
function escapeJs(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'\\"');}
function renderRota(){
  const rB=document.getElementById("royalJava"),tB=document.getElementById("taboche");
  rB.innerHTML="";tB.innerHTML="";
  staff.forEach((m,i)=>{
    const row=document.createElement("tr");
    const sList=m.restaurant==="Royal Java"?shiftsRoyal:shiftsTaboche;
    let html=`<td><strong>${escapeHtml(m.name)}</strong></td>`;
    currentWeekDates.forEach(d=>{
      const k=dateKey(d);const day=days[d.getDay()];
      const isOff=day===m.offDay;
      const sel=m.schedule[k]||(isOff?"OFF":m.defaultShift);
      const cls=getShiftClass(sel);
      html+=`<td><select class="shift ${cls}" onchange="onShiftChange(${i},'${escapeJs(m.restaurant)}','${k}',this)">${sList.map(s=>`<option value="${s.value}" ${s.value===sel?"selected":""}>${s.label}</option>`).join("")}</select></td>`;
    });
    row.innerHTML=html;
    (m.restaurant==="Royal Java"?rB:tB).appendChild(row);
  });
}
function onShiftChange(i,r,k,el){
  const val=el.value;el.className="shift "+getShiftClass(val);
  const mem=staff[i];const parts=k.split('-');const d=new Date(parts[0],parts[1]-1,parts[2]);
  const day=days[d.getDay()];const implied=(day===mem.offDay)?"OFF":mem.defaultShift;
  if(val===implied)delete mem.schedule[k];else mem.schedule[k]=val;
}

/* EXPORT clean premium image */
function exportImage(){
  const btns=document.getElementById("exportButtons"),foot=document.getElementById("footerMsg");
  btns.style.display="none";foot.style.display="none";
  const el=document.getElementById("rotaContent");
  el.style.boxShadow="0 0 40px rgba(0,0,0,0.1)";
  el.style.borderRadius="12px";
  el.style.padding="30px";
  el.scrollIntoView({behavior:"instant",block:"start"});window.scrollTo(0,0);
  html2canvas(el,{backgroundColor:"#ffffff",scale:3,scrollY:-window.scrollY,windowHeight:document.body.scrollHeight}).then(c=>{
    const link=document.createElement("a");
    link.download="Premium_Rota.png";
    link.href=c.toDataURL("image/png");
    link.click();
  }).finally(()=>{btns.style.display="flex";foot.style.display="block";});
}

/* SHARE to WhatsApp cleanly */
function shareViaWhatsApp(){
  if(currentWeekDates.length!==7)return alert("Set week first.");
  const btns=document.getElementById("exportButtons"),foot=document.getElementById("footerMsg");
  btns.style.display="none";foot.style.display="none";
  const el=document.getElementById("rotaContent");
  el.scrollIntoView({behavior:"instant",block:"start"});window.scrollTo(0,0);
  html2canvas(el,{backgroundColor:"#ffffff",scale:3,useCORS:true,scrollY:-window.scrollY,windowHeight:document.body.scrollHeight})
  .then(c=>{
    const link=document.createElement("a");
    link.download="Premium_Rota.png";
    link.href=c.toDataURL("image/png");
    link.click();
    alert("📸 Premium rota image ready. Open WhatsApp Web and send the downloaded image.");
    window.open("https://web.whatsapp.com/","_blank");
  }).finally(()=>{btns.style.display="flex";foot.style.display="block";});
}

/* CSV + Save */
function downloadCSV(){
  let csv="Restaurant,Staff";
  currentWeekDates.forEach(d=>csv+=`,${days[d.getDay()]} ${d.getDate()}`);
  csv+="\n";
  ["Royal Java","Taboche"].forEach(g=>{
    staff.filter(s=>s.restaurant===g).forEach(m=>{
      const row=[g,m.name];
      currentWeekDates.forEach(d=>{
        const k=dateKey(d);const day=days[d.getDay()];
        const isOff=day===m.offDay;
        const val=m.schedule[k]||(isOff?"OFF":m.defaultShift);
        row.push(val);
      });
      csv+=row.map(v=>`"${v}"`).join(",")+"\n";
    });
  });
  const blob=new Blob([csv],{type:"text/csv"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="rota.csv";a.click();
  URL.revokeObjectURL(url);
}
function saveToLocal(){localStorage.setItem("savedRota",JSON.stringify({weekStart:dateKey(currentWeekDates[0]),staff}));alert("Saved!");}
function loadFromLocal(){const r=localStorage.getItem("savedRota");if(!r)return;const p=JSON.parse(r);const pr=p.weekStart.split('-');const d=new Date(pr[0],pr[1]-1,pr[2]);document.getElementById("weekStart").valueAsDate=d;staff=p.staff||[];updateWeek();}
function clearSaved(){localStorage.removeItem("savedRota");alert("Cleared!");}
function resetRota(){if(!confirm("Reset All?"))return;staff=[];initializeWeekToCurrentSunday();localStorage.removeItem("savedRota");}
window.addEventListener('DOMContentLoaded',()=>{const t=new Date();const s=new Date(t.getFullYear(),t.getMonth(),t.getDate()-t.getDay());document.getElementById("weekStart").valueAsDate=s;});
</script>
</body>
</html>
