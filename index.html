<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Restaurant Staff Rota - Full Editable (Quick Fill & Copy)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --morning:#2563eb;
  --mid:#f59e0b;
  --closing:#7c3aed;
  --off:#dc2626;
  --light:#f9fafb;
  --border:#e5e7eb;
  --muted:#6b7280;
}
*{box-sizing:border-box}
body{
  font-family:"Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background:var(--light);
  margin:0;
  padding:18px;
  color:#111827;
}

/* LOGIN SCREEN */
#loginScreen{
  max-width:420px;
  margin:70px auto;
  background:#fff;
  padding:26px;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}
#loginScreen h2{margin:0 0 12px 0}
#loginScreen input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:15px;
}
#loginScreen button{
  width:100%;
  padding:12px;
  margin-top:10px;
  font-size:16px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
#errorMsg{
  color:#b91c1c;
  margin-top:10px;
  display:none;
}

/* MAIN APP */
#app{display:none}
.container{max-width:1200px;margin:auto}
.card{
  background:#fff;
  padding:16px;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,0.04);
  margin-bottom:20px;
}
h1,h2{margin:8px 0}
.controls input,
.controls select{
  padding:10px;
  margin:6px 0;
  width:100%;
  font-size:15px;
  border:1px solid var(--border);
  border-radius:6px;
}
.controls .row{display:flex;gap:10px}
.controls .row > *{flex:1}

/* Buttons */
button{
  padding:10px 12px;
  margin-top:8px;
  font-size:15px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
.small{
  padding:8px 10px;
  font-size:14px;
  width:auto;
}

/* Table */
.table-wrapper{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  min-width:700px;
}
th,td{
  border:1px solid var(--border);
  padding:8px;
  text-align:center;
  vertical-align:middle;
}
th{
  background:#111827;
  color:white;
  font-weight:600;
}

/* Shift select styling */
select.shift{
  width:100%;
  padding:8px;
  font-size:13px;
  border:none;
  border-radius:6px;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* SHIFT COLORS */
.shift.morning{background:var(--morning)}
.shift.mid{background:var(--mid)}
.shift.closing{background:var(--closing)}
.shift.off{background:var(--off)}

/* Utility */
.actions{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.footer{font-size:13px;color:var(--muted);margin-top:6px}
.small-muted{font-size:12px;color:var(--muted);margin-left:8px}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <h2>🔒 Secure Login</h2>
  <input type="text" id="username" placeholder="Username" autocomplete="username" />
  <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
  <button onclick="login()">Login</button>
  <div id="errorMsg">Incorrect username or password</div>
</div>

<!-- MAIN APP -->
<div id="app" aria-hidden="true">
  <div class="container">

    <div class="card controls" aria-label="Staff setup">
      <h1>Staff Setup</h1>

      <div class="row">
        <input id="name" placeholder="Staff Name" />
        <select id="restaurant" title="Restaurant">
          <option>Royal Java</option>
          <option>Taboche</option>
        </select>
      </div>

      <div class="row">
        <select id="offDay" title="Off day">
          <option>Sun</option><option>Mon</option><option>Tue</option>
          <option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option>
        </select>

        <select id="defaultShiftType" title="Default shift type">
          <option>Morning</option>
          <option>Mid</option>
          <option>Closing</option>
        </select>
      </div>

      <div class="actions" style="margin-top:8px">
        <button onclick="addStaff()">Add Staff</button>
        <button class="small" onclick="resetRota()">Reset All</button>
      </div>

      <div style="margin-top:12px">
        <label><strong>Week Start (Sunday)</strong></label>
        <div class="row" style="margin-top:6px">
          <input type="date" id="weekStart" />
          <button class="small" onclick="updateWeek()">Set Week</button>
        </div>
      </div>

      <div style="margin-top:10px" class="actions">
        <button class="small" onclick="saveToLocal()">Save Rota</button>
        <button class="small" onclick="loadFromLocal()">Load Saved</button>
        <button class="small" onclick="clearSaved()">Clear Saved</button>
      </div>

      <div class="note">Mid shift is <strong>9AM-7PM</strong>. Use per-day selects to set Morning, Mid, Closing or OFF for any day.</div>
    </div>

    <div class="card" id="rota" aria-label="Rota area">
      <h2 id="weekTitle">Weekly Rota</h2>

      <h3>Royal Java</h3>
      <div class="table-wrapper">
        <table>
          <thead><tr id="royalHeader"></tr></thead>
          <tbody id="royalJava"></tbody>
        </table>
      </div>

      <h3 style="margin-top:18px">Taboche</h3>
      <div class="table-wrapper">
        <table>
          <thead><tr id="tabocheHeader"></tr></thead>
          <tbody id="taboche"></tbody>
        </table>
      </div>

      <div class="actions" style="margin-top:12px">
        <button onclick="exportImage()">Export as Image</button>
        <button class="small" onclick="downloadCSV()">Download CSV</button>
        <button class="small" onclick="shareViaWhatsApp()">📱 Share to WhatsApp</button>
      </div>

      <div class="footer">Tip: Click on any shift dropdown to change it. Staff member's off day and default shift are set during creation.</div>
    </div>
  </div>
</div>

<script>
/* ---------------------------
   Full Rota System
   - Per-day editable schedule stored per-date
   - Mid shift set to 9AM–7PM
   - Clean table with just staff names and shift selects
   - Save/Load to localStorage, CSV export, PNG export
   - WhatsApp share
   --------------------------- */

let staff = []; // each staff: {name, restaurant, offDay, defaultShiftType, defaultShift, schedule: { "YYYY-MM-DD": "shiftValue" } }
const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Updated shift times (Mid = 9AM–7PM)
const shiftsRoyal = [
  { value: "OFF", label: "OFF" },
  { value: "7AM–5PM", label: "7AM–5PM" },
  { value: "9AM–7PM", label: "9AM–7PM" },
  { value: "11AM–9PM", label: "11AM–9PM" }
];

const shiftsTaboche = [
  { value: "OFF", label: "OFF" },
  { value: "7AM–5PM", label: "7AM–5PM" },
  { value: "9AM–7PM", label: "9AM–7PM" },
  { value: "10AM–8PM", label: "10AM–8PM" }
];

let currentWeekDates = []; // array of Date objects for the week

/* LOGIN SYSTEM */
function login(){
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  if(user === "royaljava" && pass === "Incorrect90!"){
    document.getElementById("loginScreen").style.display = "none";
    const app = document.getElementById("app");
    app.style.display = "block";
    app.setAttribute("aria-hidden","false");
    initializeWeekToCurrentSunday();
    loadFromLocal(); // attempt to load saved rota automatically
  } else {
    const err = document.getElementById("errorMsg");
    err.style.display = "block";
    setTimeout(()=> err.style.display = "none", 3000);
  }
}

/* Initialize week start to the most recent Sunday without mutating today's date */
function initializeWeekToCurrentSunday(){
  const today = new Date();
  const sunday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay());
  document.getElementById("weekStart").valueAsDate = sunday;
  updateWeek();
}

/* Add staff */
function addStaff(){
  const name = document.getElementById("name").value.trim();
  const restaurant = document.getElementById("restaurant").value;
  const offDay = document.getElementById("offDay").value;
  const defaultShiftType = document.getElementById("defaultShiftType").value;

  if(!name) return alert("Enter staff name");

  const defaultShift = mapDefaultShift(defaultShiftType, restaurant);

  staff.push({
    name,
    restaurant,
    offDay,
    defaultShiftType,
    defaultShift,
    schedule: {} // per-date overrides stored here
  });

  document.getElementById("name").value = "";
  renderRota();
}

/* Map default shift type to the exact shift string for the chosen restaurant */
function mapDefaultShift(type, restaurant){
  const options = restaurant === "Royal Java" ? shiftsRoyal : shiftsTaboche;
  if(type === "Morning") return options[1].value;
  if(type === "Mid") return options[2].value; // 9AM–7PM
  return options[3].value; // Closing
}

/* Update week based on date input */
function updateWeek(){
  const start = document.getElementById("weekStart").value;
  if(!start) return alert("Select a week start date");

  const startDate = new Date(start);
  currentWeekDates = [];
  for(let i=0;i<7;i++){
    const d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
    currentWeekDates.push(d);
  }

  const endDate = currentWeekDates[6];
  document.getElementById("weekTitle").innerText =
    `Weekly Rota (${startDate.toDateString()} - ${endDate.toDateString()})`;

  renderHeaders();
  renderRota();
}

/* Render table headers - only "Staff" as the first column header */
function renderHeaders(){
  const header = "<th>Staff</th>" +
    currentWeekDates.map(d => `<th>${days[d.getDay()]}<br>${d.getDate()}</th>`).join("");

  document.getElementById("royalHeader").innerHTML = header;
  document.getElementById("tabocheHeader").innerHTML = header;
}

/* Determine CSS class for a shift value */
function getShiftClass(shift){
  if(shift === "OFF") return "off";
  if(shift === "7AM–5PM") return "morning";
  if(shift === "9AM–7PM") return "mid";
  if(shift === "11AM–9PM" || shift === "10AM–8PM") return "closing";
  return "mid";
}

/* Build options HTML for a given restaurant's shift list and selected value */
function buildShiftOptions(shiftList, selectedValue){
  return shiftList.map(s => `<option value="${s.value}" ${s.value === selectedValue ? "selected" : ""}>${s.label}</option>`).join("");
}

/* Format date as YYYY-MM-DD for keys */
function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function renderRota(){
  const royalBody = document.getElementById("royalJava");
  const tabBody = document.getElementById("taboche");
  royalBody.innerHTML = "";
  tabBody.innerHTML = "";

  staff.forEach((member, idx) => {
    const row = document.createElement("tr");
    const shiftOptions = member.restaurant === "Royal Java" ? shiftsRoyal : shiftsTaboche;

    // Staff name cell - just the name, no controls
    let cells = `<td><strong>${escapeHtml(member.name)}</strong></td>`;

    currentWeekDates.forEach(d => {
      const key = dateKey(d);
      const dayName = days[d.getDay()];
      const isOff = dayName === member.offDay;
      const selected = (member.schedule && member.schedule[key]) ? member.schedule[key] : (isOff ? "OFF" : member.defaultShift);
      const cls = getShiftClass(selected);

      cells += `<td>
        <select class="shift ${cls}" onchange="onShiftChange(${idx}, '${escapeJs(member.restaurant)}', '${key}', this)">
          ${shiftOptions.map(s => `<option value="${s.value}" ${s.value === selected ? "selected" : ""}>${s.label}</option>`).join("")}
        </select>
      </td>`;
    });

    row.innerHTML = cells;
    if(member.restaurant === "Royal Java") royalBody.appendChild(row);
    else tabBody.appendChild(row);
  });
}

/* Handler when a shift select changes for a specific date */
function onShiftChange(staffIndex, restaurant, dateKeyStr, selectEl){
  const newValue = selectEl.value;
  selectEl.className = 'shift ' + getShiftClass(newValue);

  if(!staff[staffIndex].schedule) staff[staffIndex].schedule = {};

  const member = staff[staffIndex];
  const dateParts = dateKeyStr.split('-');
  const d = new Date(Number(dateParts[0]), Number(dateParts[1]) - 1, Number(dateParts[2]));
  const dayName = days[d.getDay()];
  const implied = (dayName === member.offDay) ? "OFF" : member.defaultShift;

  if(newValue === implied){
    if(member.schedule && member.schedule[dateKeyStr]) delete member.schedule[dateKeyStr];
  } else {
    member.schedule[dateKeyStr] = newValue;
  }

  renderRota();
}

/* Export rota area as PNG */
function exportImage(){
  const el = document.querySelector("#rota");
  html2canvas(el, { backgroundColor: "#ffffff", scale: 2 }).then(canvas => {
    const link = document.createElement("a");
    link.download = "rota.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }).catch(err => {
    alert("Export failed. Try again.");
    console.error(err);
  });
}

/* Download a simple CSV representation of the current rota */
function downloadCSV(){
  if(currentWeekDates.length !== 7) return alert("Set the week first.");
  let csv = "Restaurant,Staff";
  currentWeekDates.forEach(d => csv += `,${days[d.getDay()]} ${d.getDate()}`);
  csv += "\n";

  const groups = ["Royal Java","Taboche"];
  groups.forEach(g => {
    staff.filter(s => s.restaurant === g).forEach(member => {
      const row = [g, member.name];
      currentWeekDates.forEach(d => {
        const key = dateKey(d);
        const dayName = days[d.getDay()];
        const isOff = dayName === member.offDay;
        const value = (member.schedule && member.schedule[key]) ? member.schedule[key] : (isOff ? "OFF" : member.defaultShift);
        row.push(value);
      });
      csv += row.map(v => `"${v}"`).join(",") + "\n";
    });
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rota.csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* Share rota via WhatsApp (formatted text) */
function shareViaWhatsApp(){
  if(currentWeekDates.length !== 7) return alert("Set the week first.");

  const weekStart = currentWeekDates[0].toDateString();
  const weekEnd = currentWeekDates[6].toDateString();

  let message = `🗓️ *WEEKLY ROTA* (${weekStart} - ${weekEnd})\n\n`;

  const groups = ["Royal Java", "Taboche"];

  groups.forEach(g => {
    message += `*${g}*\n`;
    staff.filter(s => s.restaurant === g).forEach(member => {
      let line = `${member.name}: `;
      currentWeekDates.forEach(d => {
        const key = dateKey(d);
        const dayName = days[d.getDay()];
        const isOff = dayName === member.offDay;
        const value = (member.schedule && member.schedule[key]) ? member.schedule[key] : (isOff ? "OFF" : member.defaultShift);

        // shorten shift for compact display
        let short = value.replace(/[–-].*$/,'');
        if(short === "OFF") short = "❌";
        else if(short === "7AM") short = "🌅";
        else if(short === "9AM") short = "☀️";
        else if(short === "11AM" || short === "10AM") short = "🌙";
        else short = value;

        line += ` ${short}`;
      });
      message += line + "\n";
    });
    message += "\n";
  });

  message += "_Generated by Restaurant Rota System_";

  const encoded = encodeURIComponent(message);
  window.open(`https://wa.me/?text=${encoded}`, '_blank');
}

/* Reset everything to start fresh */
function resetRota(){
  if(!confirm("Reset all staff and week to current week?")) return;
  staff = [];
  initializeWeekToCurrentSunday();
  renderRota();
  localStorage.removeItem("savedRota");
}

/* Save current rota (staff + weekStart) to localStorage */
function saveToLocal(){
  if(currentWeekDates.length !== 7) return alert("Set the week first.");
  const startKey = dateKey(currentWeekDates[0]);
  const payload = {
    weekStart: startKey,
    staff
  };
  try{
    localStorage.setItem("savedRota", JSON.stringify(payload));
    alert("Rota saved locally.");
  }catch(e){
    console.error(e);
    alert("Save failed.");
  }
}

/* Load rota from localStorage if present */
function loadFromLocal(){
  try{
    const raw = localStorage.getItem("savedRota");
    if(!raw) return;
    const payload = JSON.parse(raw);
    if(payload && payload.weekStart){
      const parts = payload.weekStart.split('-');
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      document.getElementById("weekStart").valueAsDate = d;
      staff = payload.staff || [];
      updateWeek();
      renderRota();
    }
  }catch(e){
    console.error(e);
    alert("Load failed.");
  }
}

/* Clear saved rota from localStorage */
function clearSaved(){
  if(!confirm("Clear saved rota from local storage?")) return;
  localStorage.removeItem("savedRota");
  alert("Saved rota cleared.");
}

/* Utility: escape HTML to avoid injection in names */
function escapeHtml(str){
  return String(str).replace(/[&<>"'`=\/]/g, function(s){
    return ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'
    })[s];
  });
}

/* Utility: escape JS string for inline attributes */
function escapeJs(str){
  return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
}

/* Initialize on page load */
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  const sunday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - today.getDay());
  document.getElementById("weekStart").valueAsDate = sunday;
});
</script>
</body>
</html>
